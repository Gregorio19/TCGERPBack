name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tcgerp_test
      JWT_SECRET: ci-test-secret
      ATTACHMENTS_STORAGE: memory
      NODE_ENV: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tcgerp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tcgerp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run build
      - run: npx prisma migrate deploy
      - run: NODE_ENV=test npx tsx prisma/seed.ts
      - run: npm run test:integration
