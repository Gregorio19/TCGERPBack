openapi: 3.1.0
info:
  title: TCG ERP API
  version: 1.0.0
  description: |
    Especificación completa de la API para el sistema TCG ERP.
    Extraída del código del frontend, mocks MSW y fixtures.
  contact:
    name: TCG ERP Team
servers:
  - url: https://api.tcg-erp.com/v1
    description: Producción
  - url: http://localhost:3001/api
    description: Desarrollo local

tags:
  - name: auth
    description: Autenticación y sesiones
  - name: products
    description: Gestión de productos TCG
  - name: inventory
    description: Gestión de inventario y stock
  - name: recepciones
    description: Recepciones de productos
  - name: transferencias
    description: Transferencias entre sucursales
  - name: proveedores
    description: Gestión de proveedores
  - name: sales
    description: Ventas y transacciones
  - name: orders
    description: Órdenes de clientes
  - name: customers
    description: Gestión de clientes
  - name: accounting
    description: Contabilidad y libros contables
  - name: rrhh
    description: Recursos Humanos
  - name: admin
    description: Administración del sistema
  - name: forecast
    description: Proyecciones y forecast de ventas
  - name: reports
    description: Reportes y estadísticas
  - name: dashboard
    description: Dashboard y métricas

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT de autenticación

  parameters:
    page:
      name: page
      in: query
      description: Número de página (1-based)
      schema:
        type: integer
        minimum: 1
        default: 1
    pageSize:
      name: limit
      in: query
      description: Tamaño de página
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    sortBy:
      name: sortBy
      in: query
      description: Campo por el cual ordenar
      schema:
        type: string
    sortDir:
      name: sortOrder
      in: query
      description: Dirección de ordenamiento
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    search:
      name: search
      in: query
      description: Búsqueda de texto
      schema:
        type: string
    branchId:
      name: sucursalId
      in: query
      description: ID de sucursal
      schema:
        type: string
    dateFrom:
      name: fechaDesde
      in: query
      description: Fecha desde (ISO 8601)
      schema:
        type: string
        format: date-time
    dateTo:
      name: fechaHasta
      in: query
      description: Fecha hasta (ISO 8601)
      schema:
        type: string
        format: date-time
    busqueda:
      name: busqueda
      in: query
      description: Búsqueda de texto (alias de `search`, contrato panel admin)
      schema:
        type: string
    fechaCreacionDesde:
      name: fechaCreacionDesde
      in: query
      description: Filtrar usuarios creados desde (ISO 8601)
      schema:
        type: string
        format: date-time
    fechaCreacionHasta:
      name: fechaCreacionHasta
      in: query
      description: Filtrar usuarios creados hasta (ISO 8601)
      schema:
        type: string
        format: date-time

  responses:
    Error422:
      description: Error de validación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: "Conflicto (ej: SKU duplicado)"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: La sesión no tiene el permiso requerido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyLoginAttempts:
      description: Límite de 5 fallos por IP y usuario o 10 por usuario en 15 minutos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
    AuthUser:
      type: object
      required: [id, username, email, nombre, apellido, role, permissions]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        nombre:
          type: string
        apellido:
          type: string
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
    AuthSession:
      type: object
      required: [token, refreshToken, expiresIn, user]
      properties:
        token:
          type: string
          description: Token de acceso JWT
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Vigencia del token de acceso en segundos
        user:
          $ref: '#/components/schemas/AuthUser'
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: "VALIDATION_ERROR"
            message:
              type: string
              example: "Error de validación"
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
        success:
          type: boolean
          example: false
        timestamp:
          type: string
          format: date-time

    PaginatedResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items: {}
        pagination:
          type: object
          required:
            - page
            - limit
            - total
            - totalPages
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer
            hasNext:
              type: boolean
            hasPrev:
              type: boolean

    # Enums
    Game:
      type: string
      enum:
        - pokemon
        - yugioh
        - magic
        - digimon
        - one_piece
        - dragon_ball
        - naruto
        - bleach
        - final_fantasy
        - card_fight_vanguard
        - weiss_schwarz
        - battle_spirits
        - other

    Rarity:
      type: string
      enum:
        - comun
        - infrecuente
        - rara
        - rara_holo
        - rara_secreta
        - rara_ultra
        - rara_gold
        - rara_rainbow
        - rara_alternate
        - rara_full_art
        - rara_charizard
        - legendary
        - mythic

    Condition:
      type: string
      enum:
        - mint
        - near_mint
        - excellent
        - very_good
        - good
        - fair
        - poor
        - damaged

    Language:
      type: string
      enum:
        - espanol
        - ingles
        - japones
        - chino
        - koreano
        - frances
        - aleman
        - italiano
        - portugues
        - ruso

    ProductType:
      type: string
      enum:
        - single
        - sellado
        - bundle
        - collection

    DocType:
      type: string
      enum:
        - boleta
        - factura
        - nota_credito
        - nota_debito
        - guia_despacho
        - recibo

    OrderStatus:
      type: string
      enum:
        - pendiente
        - voucher_impreso
        - confirmada
        - en_proceso
        - enviada
        - entregada
        - completada
        - cancelada
        - reembolsada
        - devuelta
        - devuelta_parcial

    OrderChannel:
      type: string
      enum:
        - tienda_fisica
        - online
        - telefono
        - whatsapp
        - redes_sociales
        - marketplace
        - mayorista
        - evento
        - other

    OrderItemInput:
      type: object
      required:
        - productId
        - cantidad
        - precioUnitario
      properties:
        productId:
          type: integer
          format: int64
          minimum: 1
        cantidad:
          type: integer
          minimum: 1
        precioUnitario:
          type: integer
          format: int64
          minimum: 1
          description: Precio unitario en CLP en pesos enteros
        descuento:
          type: integer
          format: int64
          minimum: 0
          default: 0

    PaymentMethod:
      type: string
      enum: [efectivo, debito, credito, transferencia, credito_tienda]

    ReturnRequest:
      type: object
      required: [items, reason, refundMethod]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
        refundMethod:
          $ref: '#/components/schemas/PaymentMethod'
          description: El crédito en tienda requiere un cliente asociado a la orden.
        items:
          type: array
          minItems: 1
          maxItems: 100
          description: Cada ítem de la orden debe aparecer una sola vez.
          items:
            $ref: '#/components/schemas/ReturnItemInput'

    ReturnItemInput:
      type: object
      required: [orderItemId, quantity]
      properties:
        orderItemId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 2147483647 }

    OrderReturn:
      allOf:
        - $ref: '#/components/schemas/ReturnRequest'
        - type: object
          required: [id, orderId, idempotencyKey, branchId, userId, cashSessionId, refundAmount, createdAt]
          properties:
            id: { type: string, format: uuid }
            orderId: { type: string, format: uuid }
            idempotencyKey: { type: string }
            branchId: { type: string, format: uuid }
            userId: { type: string, format: uuid }
            cashSessionId: { type: [string, 'null'], format: uuid }
            refundAmount: { type: integer, minimum: 0, description: Reembolso en CLP con los descuentos prorrateados e IVA. }
            createdAt: { type: string, format: date-time }
            items:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/ReturnItemInput'
                  - type: object
                    required: [id, returnId]
                    properties:
                      id: { type: string, format: uuid }
                      returnId: { type: string, format: uuid }

    StoreCredit:
      type: object
      required: [balance, movements]
      properties:
        balance: { type: integer, minimum: 0, description: Saldo en CLP. }
        movements:
          type: array
          items:
            type: object
            required: [id, customerId, amount, reason, refType, refId, userId, createdAt]
            properties:
              id: { type: string, format: uuid }
              customerId: { type: string, format: uuid }
              amount: { type: integer, description: Variación del saldo en CLP con signo. }
              reason: { type: string }
              refType: { type: string, enum: [order, return, purchase] }
              refId: { type: string, format: uuid }
              userId: { type: string, format: uuid }
              createdAt: { type: string, format: date-time }

    CustomerPurchaseItemInput:
      type: object
      required: [productId, quantity, unitPrice]
      properties:
        productId: { type: integer, minimum: 1, maximum: 2147483647 }
        quantity: { type: integer, minimum: 1, maximum: 2147483647 }
        unitPrice: { type: integer, minimum: 1, maximum: 2147483647, description: Precio unitario en CLP. }
        condition: { $ref: '#/components/schemas/Condition' }

    CustomerPurchaseRequest:
      type: object
      required: [branchId, items, paymentMethod]
      properties:
        branchId: { type: string, format: uuid }
        paymentMethod: { type: string, enum: [efectivo, credito_tienda, transferencia] }
        notes: { type: string, maxLength: 2000 }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/CustomerPurchaseItemInput' }

    CustomerPurchase:
      type: object
      required: [id, customerId, branchId, userId, cashSessionId, visitId, total, paymentMethod, notes, createdAt, items]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        cashSessionId: { type: [string, 'null'], format: uuid }
        visitId: { type: string, format: uuid, description: Visita venta_a_tienda para adjuntar fotos. }
        total: { type: integer, minimum: 1, description: Total pagado al cliente en CLP. }
        paymentMethod: { type: string, enum: [efectivo, credito_tienda, transferencia] }
        notes: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            required: [id, purchaseId, productId, quantity, unitPrice, condition]
            properties:
              id: { type: string, format: uuid }
              purchaseId: { type: string, format: uuid }
              productId: { type: integer }
              quantity: { type: integer }
              unitPrice: { type: integer }
              condition:
                anyOf:
                  - $ref: '#/components/schemas/Condition'
                  - type: 'null'

    StockAlerts:
      type: object
      required: [count, items]
      properties:
        count: { type: integer, minimum: 0 }
        items:
          type: array
          items:
            type: object
            required: [productId, nombre, branchId, cantidad, minimo]
            properties:
              productId: { type: integer }
              nombre: { type: string }
              branchId: { type: string, format: uuid }
              cantidad: { type: integer }
              minimo: { type: integer, description: Mínimo configurado o 5 cuando el mínimo es cero. }

    DashboardKpis:
      type: object
      required: [ventasHoy, ventasMes, ticketPromedioMes, unidadesMes, topProductosMes, clientesNuevosMes, stockCritico]
      properties:
        ventasHoy: { type: integer, description: Venta neta en CLP de las órdenes creadas hoy en UTC. }
        ventasMes: { type: integer, description: Venta neta en CLP de las órdenes creadas este mes en UTC. }
        ticketPromedioMes: { type: integer, description: Venta neta mensual dividida por las órdenes procesadas. }
        unidadesMes: { type: integer, description: Unidades vendidas menos unidades devueltas. }
        clientesNuevosMes: { type: integer, description: Clientes registrados este mes en toda la tienda. }
        stockCritico: { type: integer, minimum: 0 }
        topProductosMes:
          type: array
          maxItems: 5
          items:
            type: object
            required: [productId, nombre, unidades]
            properties:
              productId: { type: integer }
              nombre: { type: string }
              unidades: { type: integer, minimum: 1 }

    AuditPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            type: object
            required: [id, userId, method, path, status, entity, entityId, ip, createdAt]
            properties:
              id: { type: string, format: uuid }
              userId: { type: [string, 'null'], format: uuid }
              method: { type: string, enum: [POST, PUT, PATCH, DELETE] }
              path: { type: string }
              status: { type: integer }
              entity: { type: [string, 'null'] }
              entityId: { type: [string, 'null'] }
              ip: { type: [string, 'null'] }
              createdAt: { type: string, format: date-time }
        pagination:
          type: object
          required: [page, limit, total, totalPages, hasNext, hasPrev]
          properties:
            page: { type: integer, minimum: 1 }
            limit: { type: integer, const: 25 }
            total: { type: integer, minimum: 0 }
            totalPages: { type: integer, minimum: 0 }
            hasNext: { type: boolean }
            hasPrev: { type: boolean }

    Indicadores:
      type: object
      required: [uf, utm, dolar, fecha]
      properties:
        uf: { type: number }
        utm: { type: number }
        dolar: { type: number }
        fecha: { type: string, format: date-time }

    PaymentInput:
      type: object
      required: [method, amount]
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethod'
          description: credito_tienda requiere cliente y saldo suficiente.
        amount:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Monto en CLP. En efectivo indica cuánto entregó el cliente.
        reference: { type: string, minLength: 1, maxLength: 255 }

    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        method:
          $ref: '#/components/schemas/PaymentMethod'
        amount: { type: integer, description: Monto aplicado a la orden en CLP. Los reembolsos se registran con signo negativo. }
        reference: { type: [string, 'null'] }
        cashSessionId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }

    Seller:
      type: [object, 'null']
      required: [id, nombre]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }

    StockMovementType:
      type: string
      enum: [venta, recepcion, transferencia_salida, transferencia_entrada, ajuste, devolucion, compra_cliente]

    StockMovement:
      type: object
      properties:
        id: { type: string, format: uuid }
        productId: { type: integer }
        branchId: { type: string, format: uuid }
        type:
          $ref: '#/components/schemas/StockMovementType'
        quantity: { type: integer, description: Variación de unidades con signo. }
        balanceAfter: { type: integer, description: Saldo de la sucursal tras el movimiento. }
        reason: { type: [string, 'null'] }
        refType:
          type: [string, 'null']
          enum: [order, reception, transfer, return, purchase, null]
        refId: { type: [string, 'null'], format: uuid }
        userId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    CashSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        openedAt: { type: string, format: date-time }
        openingAmount: { type: integer, minimum: 0 }
        closedAt: { type: [string, 'null'], format: date-time }
        closedById: { type: [string, 'null'], format: uuid }
        countedAmount: { type: [integer, 'null'], minimum: 0 }
        expectedAmount: { type: [integer, 'null'] }
        difference: { type: [integer, 'null'] }
        notes: { type: [string, 'null'] }
        status: { type: string, enum: [abierta, cerrada] }

    CashSessionSummary:
      allOf:
        - $ref: '#/components/schemas/CashSession'
        - type: object
          required: [expectedAmount, totalsByMethod, salesCount, cashSales, cashRefunds, cashCustomerPurchases]
          properties:
            expectedAmount: { type: integer, description: Apertura más ventas en efectivo menos reembolsos y compras al cliente en efectivo. }
            cashSales: { type: integer, minimum: 0 }
            cashRefunds: { type: integer, minimum: 0 }
            cashCustomerPurchases: { type: integer, minimum: 0 }
            totalsByMethod:
              type: object
              required: [efectivo, debito, credito, transferencia, credito_tienda]
              properties:
                efectivo: { type: integer }
                debito: { type: integer }
                credito: { type: integer }
                transferencia: { type: integer }
                credito_tienda: { type: integer }
            salesCount: { type: integer, minimum: 0, description: Número de órdenes distintas con pagos positivos en esta sesión. }

    CustomerFields:
      type: object
      properties:
        nombre: { type: string, minLength: 1, maxLength: 100 }
        apellido: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        telefono: { type: string, example: '+56 9 1234 5678' }
        rut: { type: string, description: RUT chileno con puntos y dígito verificador válido. }
        direccion:
          type: object
          properties:
            calle: { type: string, minLength: 1, maxLength: 200 }
            numero: { type: string }
            comuna: { type: string, minLength: 1, maxLength: 100 }
            ciudad: { type: string, minLength: 1, maxLength: 100 }
            region: { type: string, minLength: 1, maxLength: 100 }
            codigoPostal: { type: string }
        canal: { type: string, minLength: 1, maxLength: 100 }
        estado: { type: string, enum: [activo, inactivo, suspendido] }

    CreateCustomerRequest:
      allOf:
        - $ref: '#/components/schemas/CustomerFields'
        - type: object
          required: [nombre]
          anyOf:
            - required: [rut]
            - required: [telefono]

    CreateOrderRequest:
      type: object
      required:
        - sucursalId
        - canal
        - tipoDocumento
        - items
      properties:
        clienteId:
          type: string
          format: uuid
          description: Omítelo para una venta a consumidor final. Requerido para pagos con crédito en tienda.
        sucursalId:
          type: string
          format: uuid
        canal:
          $ref: '#/components/schemas/OrderChannel'
        tipoDocumento:
          $ref: '#/components/schemas/DocType'
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/OrderItemInput'
        descuentoGeneral:
          type: integer
          format: int64
          minimum: 0
          default: 0
        costoEnvio:
          type: integer
          format: int64
          minimum: 0
          default: 0
        payments:
          type: array
          minItems: 1
          maxItems: 100
          description: Debe cubrir el total. En cualquier estado, el efectivo exige una caja abierta del usuario en la sucursal y queda asociado a ella. El exceso de efectivo se devuelve como vuelto.
          items:
            $ref: '#/components/schemas/PaymentInput'
        estado:
          allOf:
            - $ref: '#/components/schemas/OrderStatus'
            - not: { const: devuelta_parcial }
          default: pendiente

    UpdateOrderRequest:
      type: object
      properties:
        estado:
          allOf:
            - $ref: '#/components/schemas/OrderStatus'
            - not: { const: devuelta_parcial }
        canal:
          $ref: '#/components/schemas/OrderChannel'
        tipoDocumento:
          $ref: '#/components/schemas/DocType'
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/OrderItemInput'
        descuentoGeneral:
          type: integer
          format: int64
          minimum: 0
        costoEnvio:
          type: integer
          format: int64
          minimum: 0
        payments:
          type: array
          minItems: 1
          maxItems: 100
          description: Solo al completar una orden sin pagos registrados. El efectivo requiere la caja abierta del usuario que completa la orden en la sucursal.
          items:
            $ref: '#/components/schemas/PaymentInput'

    OrderItemResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        productId:
          type: integer
          format: int64
        cantidad:
          type: integer
        precioUnitario:
          type: integer
          format: int64
        descuento:
          type: integer
        subtotal:
          type: integer
        total:
          type: integer
        product:
          type: object
          properties:
            id:
              type: integer
            nombre:
              type: string
            sku:
              type: string
              nullable: true

    OrderCustomer:
      type: [object, 'null']
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        apellido: { type: [string, 'null'] }
        email: { type: [string, 'null'] }

    OrderResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: string
          example: "ORD-202601-0001"
        clienteId:
          type: [string, 'null']
          format: uuid
        vendedorId: { type: [string, 'null'], format: uuid }
        vendedor:
          $ref: '#/components/schemas/Seller'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        amountTendered: { type: integer, description: Efectivo entregado en CLP al crear con pagos. }
        change: { type: integer, description: Vuelto en CLP al crear con pagos. }
        sucursalId:
          type: string
          format: uuid
        estado:
