        '422': { $ref: '#/components/responses/Error422' }

  /admin/audit:
    get:
      tags: [admin]
      summary: Consultar la auditoría de cambios de la API
      x-required-permission: admin.view
      parameters:
        - { name: userId, in: query, schema: { type: string, format: uuid } }
        - name: from
          in: query
          schema:
            oneOf: [{ type: string, format: date }, { type: string, format: date-time }]
        - name: to
          in: query
          description: Una fecha sin hora incluye todo ese día en UTC.
          schema:
            oneOf: [{ type: string, format: date }, { type: string, format: date-time }]
