        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Error422'

  # ÓRDENES
  /orders:
    get:
      tags: [orders]
      summary: Listar órdenes
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [numero, fechaCreacion, total, estado]
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: search
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: canal
          in: query
          schema:
            $ref: '#/components/schemas/OrderChannel'
        - name: clienteId
          in: query
          schema:
            type: string
            format: uuid
        - name: usuarioId
          in: query
          schema:
            type: string
            format: uuid
        - name: sucursalId
          in: query
          schema:
            type: string
            format: uuid
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          schema:
            type: string
            format: date-time
        - name: montoMinimo
          in: query
          schema:
            type: integer
            format: int64
        - name: montoMaximo
          in: query
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Lista de órdenes paginada
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderResponse'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
                      hasNext:
                        type: boolean
                      hasPrev:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [orders]
      summary: Crear orden
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Orden creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          description: Los pagos no cuadran, el total está fuera de rango o se usó crédito en tienda sin cliente
        '409':
          description: Caja sin abrir, stock de sucursal insuficiente o crédito en tienda insuficiente
        '422':
          $ref: '#/components/responses/Error422'
        '403':
          $ref: '#/components/responses/Forbidden'

  /orders/{id}:
    get:
      tags: [orders]
      summary: Obtener orden por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Orden encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [orders]
      summary: Actualizar orden
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderRequest'
      responses:
        '200':
          description: Orden actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Los pagos deben cubrir el total de la orden actualizado
        '409':
          description: Caja sin abrir, stock de sucursal insuficiente o crédito en tienda insuficiente al completar la orden
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Error422'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [orders]
      summary: Eliminar orden (soft delete)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Orden eliminada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Orden ya procesada (completada/cancelada/reembolsada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /orders/{id}/timeline:
    get:
      tags: [orders]
      summary: Timeline de eventos de orden
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de eventos del timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderTimelineEvent'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

