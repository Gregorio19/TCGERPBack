    # Productos
    Product:
      type: object
      required:
        - id
        - nombre
        - precio
        - stock
        - categoria
        - activo
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
          maxLength: 200
        descripcion:
          type: string
          nullable: true
        sku:
          type: string
          nullable: true
        juego:
          $ref: '#/components/schemas/Game'
        set:
          type: string
          nullable: true
        nro_coleccionista:
          type: string
          nullable: true
        rareza:
          $ref: '#/components/schemas/Rarity'
        idioma:
          $ref: '#/components/schemas/Language'
        condicion:
          $ref: '#/components/schemas/Condition'
        tipo:
          $ref: '#/components/schemas/ProductType'
        precio:
          type: integer
          format: int64
          description: Precio en CLP (centavos)
        precio_compra:
          type: integer
          format: int64
          nullable: true
        iva:
          type: integer
          default: 19
          description: Porcentaje de IVA
        stock:
          type: integer
          minimum: 0
        categoria:
          type: string
        imagen:
          type: string
          format: uri
          nullable: true
        imagenes:
          type: array
          items:
            type: string
            format: uri
        stock_sucursales:
          type: object
          additionalProperties:
            type: integer
        activo:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateProductRequest:
      type: object
      required:
        - nombre
        - precio
        - stock
        - categoria
      properties:
        nombre:
          type: string
          maxLength: 200
        descripcion:
          type: string
          maxLength: 1000
          nullable: true
        sku:
          type: string
          maxLength: 50
          pattern: '^[A-Z0-9-]+$'
          nullable: true
        juego:
          $ref: '#/components/schemas/Game'
        set:
          type: string
          nullable: true
        nro_coleccionista:
          type: string
          nullable: true
        rareza:
          $ref: '#/components/schemas/Rarity'
        idioma:
          $ref: '#/components/schemas/Language'
        condicion:
          $ref: '#/components/schemas/Condition'
        tipo:
          $ref: '#/components/schemas/ProductType'
        precio:
          type: integer
          format: int64
          minimum: 1
          description: Precio en CLP (centavos)
        precio_compra:
          type: integer
          format: int64
          nullable: true
        iva:
          type: integer
          minimum: 0
          maximum: 100
          default: 19
          description: Porcentaje de IVA
        stock:
          type: integer
          minimum: 0
        categoria:
          type: string
        imagen:
          type: string
          format: uri
          nullable: true
        imagenes:
          type: array
          items:
            type: string
            format: uri
          nullable: true
        activo:
          type: boolean
          default: true

    UpdateProductRequest:
      type: object
      properties:
        nombre:
          type: string
        descripcion:
          type: string
        precio:
          type: integer
          format: int64
        stock:
          type: integer
        categoria:
          type: string
        imagen:
          type: string
          format: uri
        sku:
          type: string

    # --- Admin (panel /api/admin) — formas expuestas al frontend ---
    AdminPermiso:
      type: object
      required: [id, recurso, accion, descripcion, categoria]
      properties:
        id:
          type: string
          description: Identificador estable del permiso (nombre único en catálogo)
        recurso:
          type: string
        accion:
          type: string
        descripcion:
          type: string
        categoria:
          type: string

    AdminRolCompact:
      type: object
      required: [id, nombre, activo, fechaCreacion, permisos]
      properties:
        id:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        activo:
          type: boolean
        fechaCreacion:
          type: string
          format: date-time
        permisos:
          type: array
          items:
            $ref: '#/components/schemas/AdminPermiso'

    AdminRol:
      allOf:
        - $ref: '#/components/schemas/AdminRolCompact'
