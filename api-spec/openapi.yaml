      tags: [sales]
      summary: Abrir caja
      x-required-permission: sales.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branchId, openingAmount]
              properties:
                branchId: { type: string, format: uuid }
                openingAmount: { type: integer, minimum: 0, maximum: 2147483647 }
      responses:
        '201':
          description: Caja abierta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
