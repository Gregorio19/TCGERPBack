          $ref: '#/components/responses/NotFound'

  /customers/{id}/attachments:
    get:
      tags: [customers]
      summary: Listar adjuntos de un cliente
      description: |
        Metadata de archivos (imagen, PDF, Word, Excel). Descarga vía GET .../download con JWT.
        Tipos permitidos validados por magic bytes; límite 10 MB por archivo.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Lista paginada de adjuntos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CustomerAttachment'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [customers]
      summary: Subir adjunto de cliente
      security:
        - bearerAuth: []
      description: |
        Multipart `multipart/form-data`. Campo obligatorio `file`.
        Opcional `descripcion` (máx. 500 caracteres).
        Imágenes se comprimen con sharp; PDF/Office se almacenan tal cual si ≤ 10 MB.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                descripcion:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: Adjunto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAttachment'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          description: Storage S3/R2 no configurado

  /customers/{id}/attachments/{attachmentId}/download:
    get:
