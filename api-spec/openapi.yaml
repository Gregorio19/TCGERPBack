    RrhhScheduleExceptionType:
      type: string
      enum: [override, off]

    RrhhScheduleTemplate:
      type: object
      required:
        - id
        - employeeId
        - dayOfWeek
        - startTime
        - endTime
        - isActive
        - effectiveFrom
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: lunes=0 ... domingo=6
        startTime:
          type: string
          pattern: '^([01]\\d|2[0-3]):[0-5]\\d$'
          example: '09:00'
        endTime:
          type: string
          pattern: '^([01]\\d|2[0-3]):[0-5]\\d$'
          example: '18:00'
        isActive: { type: boolean }
        effectiveFrom: { type: string, format: date }
        effectiveTo:
          type: string
          format: date
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RrhhCreateScheduleTemplate:
      type: object
      required: [dayOfWeek, startTime, endTime, effectiveFrom]
      properties:
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: lunes=0 ... domingo=6
        startTime:
          type: string
          pattern: '^([01]\\d|2[0-3]):[0-5]\\d$'
        endTime:
          type: string
          pattern: '^([01]\\d|2[0-3]):[0-5]\\d$'
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
          nullable: true
        isActive:
          type: boolean
          default: true

    RrhhUpdateScheduleTemplate:
