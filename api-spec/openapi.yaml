        codigo:
          type: string
        nombre:
          type: string
        direccion:
          type: string
          nullable: true
        telefono:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        activa:
          type: boolean
        configuracion:
          $ref: '#/components/schemas/AdminConfiguracionSucursal'
        fechaCreacion:
          type: string
          format: date-time
        usuariosCount:
          type: integer
          description: Opcional según endpoint

    AdminUsuario:
      type: object
      required:
        - id
        - username
        - email
        - nombre
        - apellido
        - activo
        - fechaCreacion
        - roles
        - sucursalId
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        nombre:
          type: string
        apellido:
          type: string
        telefono:
          type: string
          nullable: true
        avatar:
          type: string
          nullable: true
        activo:
          type: boolean
        fechaCreacion:
          type: string
          format: date-time
        ultimoAcceso:
          type: string
          format: date-time
          nullable: true
        roles:
          type: array
          items:
            $ref: '#/components/schemas/AdminRolCompact'
        sucursalId:
          type: string
          nullable: true
        sucursal:
          oneOf:
            - $ref: '#/components/schemas/AdminSucursal'
            - type: 'null'

    AdminConfiguracionSistema:
      type: object
      required: [id, nombre, descripcion, valor, tipo, categoria, editable, fechaActualizacion]
      properties:
        id:
          type: string
        nombre:
          type: string
          description: Alias de `clave` en BD
        descripcion:
          type: string
        valor:
          type: string
        tipo:
          type: string
        categoria:
          type: string
        editable:
          type: boolean
        fechaActualizacion:
          type: string
          format: date-time

    AdminPagination:
      type: object
      required: [page, limit, total, totalPages, hasNext, hasPrev]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean

    AdminPaginatedUsuarios:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminUsuario'
        pagination:
          $ref: '#/components/schemas/AdminPagination'

    AdminPaginatedRoles:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminRol'
        pagination:
          $ref: '#/components/schemas/AdminPagination'

    AdminPaginatedSucursales:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminSucursal'
        pagination:
          $ref: '#/components/schemas/AdminPagination'

    AdminPaginatedSettings:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminConfiguracionSistema'
        pagination:
          $ref: '#/components/schemas/AdminPagination'

    AdminPermisosCatalogoOLista:
      description: Sin `page`/`limit` devuelve array plano; con paginación, objeto con data y pagination
      oneOf:
        - type: array
          items:
            $ref: '#/components/schemas/AdminPermiso'
        - $ref: '#/components/schemas/AdminPaginatedPermisos'

    AdminPaginatedPermisos:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminPermiso'
        pagination:
          $ref: '#/components/schemas/AdminPagination'

    EstadisticasAdmin:
      type: object
      required:
        - totalUsuarios
        - usuariosActivos
        - totalRoles
        - rolesActivos
        - totalSucursales
        - sucursalesActivas
        - totalConfiguraciones
        - ultimosUsuarios
        - rolesMasUsados
        - distribucionUsuariosPorSucursal
      properties:
        totalUsuarios:
          type: integer
        usuariosActivos:
          type: integer
        totalRoles:
          type: integer
        rolesActivos:
          type: integer
        totalSucursales:
          type: integer
        sucursalesActivas:
          type: integer
        totalConfiguraciones:
          type: integer
        ultimosUsuarios:
          type: array
          items:
            $ref: '#/components/schemas/AdminUsuario'
        rolesMasUsados:
          type: array
          items:
            type: object
            required: [rol, count]
            properties:
              count:
                type: integer
              rol:
                $ref: '#/components/schemas/AdminRolCompact'
        distribucionUsuariosPorSucursal:
          type: array
          items:
            type: object
            required: [sucursal, count]
            properties:
              count:
                type: integer
              sucursal:
                $ref: '#/components/schemas/AdminSucursal'

    DashboardStats:
      type: object
      required:
        - totalProductos
        - totalStock
        - ventasMensuales
        - carritosActivos
        - productosBajoStock
        - totalClientes
        - totalPedidos
        - topCategorias
        - ventasRecientes
        - productosPopulares
      properties:
        totalProductos:
          type: integer
        totalStock:
          type: integer
        ventasMensuales:
          type: integer
          description: Suma de totales de órdenes del mes UTC actual (excl. canceladas/reembolsadas/devueltas)
        carritosActivos:
          type: integer
          description: Siempre 0 hasta exista carrito persistido
        productosBajoStock:
          type: integer
          description: Productos activos con stock menor al umbral fijo (5)
        totalClientes:
          type: integer
        totalPedidos:
          type: integer
        topCategorias:
          type: array
          items:
            type: object
            required: [nombre, cantidad, porcentaje]
            properties:
              nombre:
                type: string
              cantidad:
                type: integer
              porcentaje:
                type: number
        ventasRecientes:
          type: array
          items:
            type: object
            required: [id, cliente, total, fecha]
            properties:
              id:
                type: string
                description: Número de orden
              cliente:
                type: string
              total:
                type: integer
              fecha:
                type: string
                format: date-time
        productosPopulares:
          type: array
          items:
            type: object
            required: [id, nombre, ventas]
            properties:
              id:
                type: integer
              nombre:
                type: string
              ventas:
                type: integer

    ChartMonthlySaleRow:
      type: object
      required: [mes, ventas, productos, clientes]
      properties:
        mes:
          type: string
          description: Etiqueta YYYY-MM (UTC)
        ventas:
          type: integer
        productos:
          type: integer
          description: Unidades vendidas (suma cantidades en ítems)
        clientes:
          type: integer
          description: Clientes distintos con pedido en el mes

    ChartCategoryRow:
      type: object
      required: [categoria, cantidad, porcentaje]
      properties:
        categoria:
          type: string
        cantidad:
          type: integer
        porcentaje:
          type: number

    ChartStockRow:
      type: object
      required: [producto, stock, stockMinimo]
      properties:
        producto:
          type: string
        stock:
          type: integer
        stockMinimo:
          type: integer
          description: Umbral de referencia (5); no persiste en Product

    ChartTrendRow:
      type: object
      required: [fecha, ingresos, gastos, ganancia]
      properties:
        fecha:
          type: string
          description: Fecha YYYY-MM-DD (UTC)
        ingresos:
          type: integer
        gastos:
          type: integer
          description: v1 siempre 0
        ganancia:
          type: integer
          description: v1 igual a ingresos

    DashboardChartsBundle:
      type: object
      required: [ventasMensuales, distribucionCategorias, estadoStock, tendencias]
      properties:
        ventasMensuales:
          type: array
          items:
            $ref: '#/components/schemas/ChartMonthlySaleRow'
        distribucionCategorias:
          type: array
          items:
            $ref: '#/components/schemas/ChartCategoryRow'
        estadoStock:
          type: array
          items:
            $ref: '#/components/schemas/ChartStockRow'
        tendencias:
          type: array
          items:
            $ref: '#/components/schemas/ChartTrendRow'

    AppointmentStatus:
      type: string
      enum: [tentative, confirmed, cancelled, completed, no_show]
    AppointmentSource:
      type: string
      enum: [manual, web, phone, whatsapp]
    AppointmentSlot:
      type: object
      required: [employeeId, startAt, endAt, durationMin, isAvailable]
      properties:
        employeeId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        durationMin:
          type: integer
        isAvailable:
          type: boolean
        reason:
          type: string
    AppointmentItem:
      type: object
      required: [id, customerId, employeeId, startAt, endAt, durationMin, status, source, customerNombre, employeeNombre, customerSnapshot, employeeSnapshot]
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        serviceTypeId:
          type: string
          format: uuid
          nullable: true
        serviceTypeName:
          type: string
          nullable: true
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        durationMin:
          type: integer
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        source:
          $ref: '#/components/schemas/AppointmentSource'
        note:
          type: string
          nullable: true
        customerNombre:
          type: string
          description: "Nombre y apellido del cliente, listo para mostrar en UI"
        employeeNombre:
          type: string
          description: "Nombre completo del empleado, listo para mostrar en UI"
        customerSnapshot:
          type: object
          required: [id, nombre, apellido, nombreCompleto]
        employeeSnapshot:
          type: object
          required: [id, nombre, apellidoPaterno, apellidoMaterno, nombreCompleto, cargo]
          properties:
            cargo:
              type: string
              nullable: true
    CreateAppointmentRequest:
      type: object
      required: [customerId, employeeId, startAt]
      properties:
        customerId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        serviceTypeId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        durationMin:
          type: integer
          enum: [15, 30, 45, 60]
        source:
          $ref: '#/components/schemas/AppointmentSource'
        note:
          type: string
        status:
          type: string
          enum: [tentative, confirmed]
    RescheduleAppointmentRequest:
      type: object
      required: [startAt]
      properties:
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        durationMin:
          type: integer
          enum: [15, 30, 45, 60]
        employeeId:
          type: string
          format: uuid
    CancelAppointmentRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
    CreateAppointmentServiceTypeRequest:
      type: object
      required: [name, durationOptions]
      properties:
        name:
          type: string
        durationOptions:
          type: array
          items:
            type: integer
        bufferBeforeMin:
          type: integer
        bufferAfterMin:
          type: integer
        allowOverbooking:
          type: boolean
        isActive:
          type: boolean
    CreateAppointmentHoldRequest:
      type: object
      required: [employeeId, startAt, endAt]
      properties:
        employeeId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        ttlMinutes:
          type: integer
          minimum: 1
          maximum: 30

paths:
  # PRODUCTOS
  /products:
    get:
      tags: [products]
      summary: Listar productos
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sortBy'
        - $ref: '#/components/parameters/sortDir'
        - $ref: '#/components/parameters/search'
        - name: category
          in: query
          schema:
            type: string
        - name: juego
          in: query
          schema:
            $ref: '#/components/schemas/Game'
        - name: rareza
          in: query
          schema:
            $ref: '#/components/schemas/Rarity'
        - name: idioma
          in: query
          schema:
            $ref: '#/components/schemas/Language'
        - name: condicion
          in: query
          schema:
            $ref: '#/components/schemas/Condition'
      responses:
        '200':
          description: Lista de productos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Product'
    post:
      tags: [products]
      summary: Crear producto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '422':
          $ref: '#/components/responses/Error422'
        '409':
          $ref: '#/components/responses/Conflict'

  /products/inactive:
    get:
      tags: [products]
      summary: Listar productos inactivos
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sortBy'
        - $ref: '#/components/parameters/sortDir'
        - $ref: '#/components/parameters/search'
        - name: category
          in: query
          schema:
            type: string
        - name: juego
          in: query
          schema:
            $ref: '#/components/schemas/Game'
        - name: rareza
          in: query
          schema:
            $ref: '#/components/schemas/Rarity'
        - name: idioma
          in: query
          schema:
            $ref: '#/components/schemas/Language'
        - name: condicion
          in: query
          schema:
            $ref: '#/components/schemas/Condition'
      responses:
        '200':
          description: Lista de productos inactivos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: No tiene permisos para ver productos inactivos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/{id}:
    get:
      tags: [products]
      summary: Obtener producto por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [products]
      summary: Actualizar producto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Error422'
    delete:
      tags: [products]
      summary: Eliminar producto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Producto eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  /products/stats:
    get:
      tags: [products]
      summary: Estadísticas de productos
      responses:
        '200':
          description: Estadísticas
          content:
            application/json:
              schema:
                type: object

  /products/categories:
    get:
      tags: [products]
      summary: Listar categorías
      responses:
        '200':
          description: Lista de categorías
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /products/low-stock:
    get:
      tags: [products]
      summary: Productos con stock bajo
      responses:
        '200':
          description: Lista de productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

  /products/{id}/stock:
    patch:
      tags: [products]
      summary: Actualizar stock de producto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - stock
              properties:
                stock:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Stock actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Error422'

  # INVENTARIO
  /inventory:
    get:
      tags: [inventory]
      summary: Listar inventario
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/search'
        - name: location
          in: query
          schema:
            type: string
        - name: lowStock
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Lista de inventario
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object

  /inventory/{id}:
    get:
      tags: [inventory]
      summary: Obtener item de inventario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Item encontrado
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [inventory]
      summary: Actualizar item de inventario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Item actualizado
        '404':
          $ref: '#/components/responses/NotFound'

  /inventory/stats:
    get:
      tags: [inventory]
      summary: Estadísticas de inventario
      responses:
        '200':
          description: Estadísticas

  /inventory/alerts:
    get:
      tags: [inventory]
      summary: Alertas de inventario
      parameters:
        - name: priority
          in: query
          schema:
            type: string
            enum: [alta, media, baja]
        - name: type
          in: query
          schema:
            type: string
            enum: [sin_stock, bajo_stock, stock_alto]
      responses:
        '200':
          description: Lista de alertas

  /inventory/low-stock:
    get:
      tags: [inventory]
      summary: Productos con stock bajo
      responses:
        '200':
          description: Lista de productos

  /inventory/out-of-stock:
    get:
      tags: [inventory]
      summary: Productos sin stock
      responses:
        '200':
          description: Lista de productos

  /inventory/{id}/stock:
    patch:
      tags: [inventory]
      summary: Actualizar stock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - stockActual
              properties:
                stockActual:
                  type: integer
                motivo:
                  type: string
      responses:
        '200':
          description: Stock actualizado
        '404':
          $ref: '#/components/responses/NotFound'

  /inventory/locations:
    get:
      tags: [inventory]
      summary: Listar ubicaciones
      responses:
        '200':
          description: Lista de ubicaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /inventory/by-location/{location}:
    get:
      tags: [inventory]
      summary: Inventario por ubicación
      parameters:
        - name: location
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Lista de inventario

  /inventory/adjustment:
    post:
      tags: [inventory]
      summary: Ajuste de inventario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productoId
                - cantidad
                - motivo
                - tipo
              properties:
                productoId:
                  type: integer
                cantidad:
                  type: integer
                motivo:
                  type: string
                tipo:
                  type: string
                  enum: [entrada, salida]
      responses:
        '201':
          description: Ajuste realizado
        '422':
          $ref: '#/components/responses/Error422'

  # RECEPCIONES
  /recepciones:
    get:
      tags: [recepciones]
      summary: Listar recepciones
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/search'
        - name: proveedor
          in: query
          schema:
            type: string
        - name: estado
          in: query
          schema:
            type: string
        - name: sucursal
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/dateFrom'
        - $ref: '#/components/parameters/dateTo'
      responses:
        '200':
          description: Lista de recepciones
    post:
      tags: [recepciones]
      summary: Crear recepción
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Recepción creada
        '422':
          $ref: '#/components/responses/Error422'

  /recepciones/{id}:
    get:
      tags: [recepciones]
      summary: Obtener recepción por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recepción encontrada
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [recepciones]
      summary: Actualizar recepción
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recepción actualizada
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [recepciones]
      summary: Eliminar recepción
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recepción eliminada
        '404':
          $ref: '#/components/responses/NotFound'

  # TRANSFERENCIAS
  /transferencias:
    get:
      tags: [transferencias]
      summary: Listar transferencias
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/search'
        - name: sucursalOrigen
          in: query
          schema:
            type: string
        - name: sucursalDestino
          in: query
          schema:
            type: string
        - name: estado
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/dateFrom'
        - $ref: '#/components/parameters/dateTo'
      responses:
        '200':
          description: Lista de transferencias
    post:
      tags: [transferencias]
      summary: Crear transferencia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Transferencia creada
        '422':
          $ref: '#/components/responses/Error422'

  /transferencias/{id}:
    get:
      tags: [transferencias]
      summary: Obtener transferencia por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transferencia encontrada
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [transferencias]
      summary: Actualizar transferencia
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transferencia actualizada
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [transferencias]
      summary: Eliminar transferencia
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transferencia eliminada
        '404':
          $ref: '#/components/responses/NotFound'

  # PROVEEDORES
  /proveedores:
    get:
      tags: [proveedores]
      summary: Listar proveedores
      parameters:
        - $ref: '#/components/parameters/page'
