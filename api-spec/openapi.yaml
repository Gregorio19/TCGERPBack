openapi: 3.1.0
info:
  title: TCG ERP API
  version: 1.0.0
  description: |
    Especificación completa de la API para el sistema TCG ERP.
    Extraída del código del frontend, mocks MSW y fixtures.
  contact:
    name: TCG ERP Team
servers:
  - url: https://api.tcg-erp.com/v1
    description: Producción
  - url: http://localhost:3001/api
    description: Desarrollo local

tags:
  - name: products
    description: Gestión de productos TCG
  - name: inventory
    description: Gestión de inventario y stock
  - name: recepciones
    description: Recepciones de productos
  - name: transferencias
    description: Transferencias entre sucursales
  - name: proveedores
    description: Gestión de proveedores
  - name: sales
    description: Ventas y transacciones
  - name: orders
    description: Órdenes de clientes
  - name: customers
    description: Gestión de clientes
  - name: accounting
    description: Contabilidad y libros contables
  - name: rrhh
    description: Recursos Humanos
  - name: admin
    description: Administración del sistema
  - name: forecast
    description: Proyecciones y forecast de ventas
  - name: reports
    description: Reportes y estadísticas
  - name: dashboard
    description: Dashboard y métricas

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT de autenticación

  parameters:
    page:
      name: page
      in: query
      description: Número de página (1-based)
      schema:
        type: integer
        minimum: 1
        default: 1
    pageSize:
      name: limit
      in: query
      description: Tamaño de página
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    sortBy:
      name: sortBy
      in: query
      description: Campo por el cual ordenar
      schema:
        type: string
    sortDir:
      name: sortOrder
      in: query
      description: Dirección de ordenamiento
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    search:
      name: search
      in: query
      description: Búsqueda de texto
      schema:
        type: string
    branchId:
      name: sucursalId
      in: query
      description: ID de sucursal
      schema:
        type: string
    dateFrom:
      name: fechaDesde
      in: query
      description: Fecha desde (ISO 8601)
      schema:
        type: string
        format: date-time
    dateTo:
      name: fechaHasta
      in: query
      description: Fecha hasta (ISO 8601)
      schema:
        type: string
        format: date-time
    busqueda:
      name: busqueda
      in: query
      description: Búsqueda de texto (alias de `search`, contrato panel admin)
      schema:
        type: string
    fechaCreacionDesde:
      name: fechaCreacionDesde
      in: query
      description: Filtrar usuarios creados desde (ISO 8601)
      schema:
        type: string
        format: date-time
    fechaCreacionHasta:
      name: fechaCreacionHasta
      in: query
      description: Filtrar usuarios creados hasta (ISO 8601)
      schema:
        type: string
        format: date-time

  responses:
    Error422:
      description: Error de validación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: "Conflicto (ej: SKU duplicado)"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: "VALIDATION_ERROR"
            message:
              type: string
              example: "Error de validación"
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
        success:
          type: boolean
          example: false
        timestamp:
          type: string
          format: date-time

    PaginatedResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items: {}
        pagination:
          type: object
          required:
            - page
            - limit
            - total
            - totalPages
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer
            hasNext:
              type: boolean
            hasPrev:
              type: boolean

    # Enums
    Game:
      type: string
      enum:
        - pokemon
        - yugioh
        - magic
        - digimon
        - one_piece
        - dragon_ball
        - naruto
        - bleach
        - final_fantasy
        - card_fight_vanguard
        - weiss_schwarz
        - battle_spirits
        - other

    Rarity:
      type: string
      enum:
        - comun
        - infrecuente
        - rara
        - rara_holo
        - rara_secreta
        - rara_ultra
        - rara_gold
        - rara_rainbow
        - rara_alternate
        - rara_full_art
        - rara_charizard
        - legendary
        - mythic

    Condition:
      type: string
      enum:
        - mint
        - near_mint
        - excellent
        - very_good
        - good
        - fair
        - poor
        - damaged

    Language:
      type: string
      enum:
        - espanol
        - ingles
        - japones
        - chino
        - koreano
        - frances
        - aleman
        - italiano
        - portugues
        - ruso

    ProductType:
      type: string
      enum:
        - single
        - sellado
        - bundle
        - collection

    DocType:
      type: string
      enum:
        - boleta
        - factura
        - nota_credito
        - nota_debito
        - guia_despacho
        - recibo

    OrderStatus:
      type: string
      enum:
        - pendiente
        - voucher_impreso
        - confirmada
        - en_proceso
        - enviada
        - entregada
        - completada
        - cancelada
        - reembolsada
        - devuelta

    OrderChannel:
      type: string
      enum:
        - tienda_fisica
        - online
        - telefono
        - whatsapp
        - redes_sociales
        - marketplace
        - mayorista
        - evento
        - other

    OrderItemInput:
      type: object
      required:
        - productId
        - cantidad
        - precioUnitario
      properties:
        productId:
          type: integer
          format: int64
          minimum: 1
        cantidad:
          type: integer
          minimum: 1
        precioUnitario:
          type: integer
          format: int64
          minimum: 1
          description: Precio unitario en CLP (centavos)
        descuento:
          type: integer
          format: int64
          minimum: 0
          default: 0

    CreateOrderRequest:
      type: object
      required:
        - clienteId
        - sucursalId
        - canal
        - tipoDocumento
        - items
      properties:
        clienteId:
          type: string
          format: uuid
        sucursalId:
          type: string
          format: uuid
        canal:
          $ref: '#/components/schemas/OrderChannel'
        tipoDocumento:
          $ref: '#/components/schemas/DocType'
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/OrderItemInput'
        descuentoGeneral:
          type: integer
          format: int64
          minimum: 0
          default: 0
        costoEnvio:
          type: integer
          format: int64
          minimum: 0
          default: 0
        estado:
          $ref: '#/components/schemas/OrderStatus'
          default: pendiente

    UpdateOrderRequest:
      type: object
      properties:
        estado:
          $ref: '#/components/schemas/OrderStatus'
        canal:
          $ref: '#/components/schemas/OrderChannel'
        tipoDocumento:
          $ref: '#/components/schemas/DocType'
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/OrderItemInput'
        descuentoGeneral:
          type: integer
          format: int64
          minimum: 0
        costoEnvio:
          type: integer
          format: int64
          minimum: 0

    OrderItemResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        productId:
          type: integer
          format: int64
        cantidad:
          type: integer
        precioUnitario:
          type: integer
          format: int64
        descuento:
          type: integer
        subtotal:
          type: integer
        total:
          type: integer
        product:
          type: object
          properties:
            id:
              type: integer
            nombre:
              type: string
            sku:
              type: string
              nullable: true

    OrderResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: string
          example: "ORD-202601-0001"
        clienteId:
          type: string
          format: uuid
        sucursalId:
          type: string
          format: uuid
        estado:
          $ref: '#/components/schemas/OrderStatus'
        canal:
          $ref: '#/components/schemas/OrderChannel'
        tipoDocumento:
          $ref: '#/components/schemas/DocType'
        subtotal:
          type: integer
          format: int64
        descuentoGeneral:
          type: integer
          format: int64
        subtotalConDescuento:
          type: integer
          format: int64
        montoIva:
          type: integer
          format: int64
        costoEnvio:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time
        cliente:
          type: object
          properties:
            id:
              type: string
              format: uuid
            nombre:
              type: string
            apellido:
              type: string
            email:
              type: string
        sucursal:
          type: object
          properties:
            id:
              type: string
              format: uuid
            nombre:
              type: string
            codigo:
              type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'

    OrderTimelineEvent:
      type: object
      properties:
        fecha:
          type: string
          format: date-time
        evento:
          type: string
          example: "Orden creada"
        estado:
          type: string

    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        apellido:
          type: string
        email:
          type: string
        telefono:
          type: string
        rut:
          type: string
        direccion:
          type: object
        estado:
          type: string
        fechaRegistro:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        fechaUltimaCompra:
          type: string
          format: date-time
          nullable: true
          description: Fecha de la última compra del cliente (vacío si no tiene compras)
        montoUltimaCompra:
          type: integer
          format: int64
          nullable: true
          description: Monto total en CLP de la última compra (vacío si no tiene compras)

    CustomerAttachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        originalName:
          type: string
        mimeType:
          type: string
          description: MIME almacenado (imágenes pueden convertirse a JPEG/WebP)
        originalSizeBytes:
          type: integer
        storedSizeBytes:
          type: integer
          description: Tamaño final en R2 (menor en imágenes comprimidas)
        descripcion:
          type: string
          nullable: true
          maxLength: 500
        createdAt:
          type: string
          format: date-time
        uploadedBy:
          type: object
          properties:
            nombre:
              type: string
            username:
              type: string
        downloadPath:
          type: string
          description: Ruta relativa; usar con JWT en GET .../download (redirect 302 a URL firmada)

    CustomerVisitAttachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        visitId:
          type: string
          format: uuid
        originalName:
          type: string
        mimeType:
          type: string
        originalSizeBytes:
          type: integer
        storedSizeBytes:
          type: integer
        descripcion:
          type: string
          nullable: true
          maxLength: 500
        createdAt:
          type: string
          format: date-time
        uploadedBy:
          type: object
          properties:
            nombre:
              type: string
            username:
              type: string
        downloadPath:
          type: string
          description: Ruta relativa; GET con JWT en .../visits/{visitId}/attachments/{id}/download

    CustomerVisit:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        fecha:
          type: string
          format: date-time
        descripcion:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        usuario:
          type: object
          properties:
            nombre:
              type: string
            username:
              type: string
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/CustomerVisitAttachment'

    # --- RRHH (alineado con API_RRHH_CONSUMIDA_POR_FRONTEND.md y backend) ---
    RrhhApiEnvelope:
      type: object
      required: [success, message, timestamp, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: OK
        timestamp:
          type: string
          format: date-time
        data:
          description: Cuerpo según endpoint (objeto, lista o paginado)

    RrhhDeleteEnvelope:
      type: object
      required: [success, message, timestamp]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Empleado eliminado
        timestamp:
          type: string
          format: date-time

    RrhhPagination:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean

    RrhhDireccion:
      type: object
      properties:
        calle: { type: string }
        numero: { type: string }
        comuna: { type: string }
        region: { type: string }
        codigoPostal:
          type: string
          nullable: true

    RrhhDatosBancarios:
      type: object
      properties:
        banco: { type: string }
        tipoCuenta: { type: string }
        numeroCuenta: { type: string }
        rutTitular: { type: string }

    RrhhPrevisional:
      type: object
      properties:
        afp: { type: string }
        salud: { type: string }
        isapre: { type: string, nullable: true }
        mutual: { type: boolean, nullable: true }
        afc: { type: boolean, nullable: true }
        porcentajeAFC: { type: number, format: float, nullable: true }

    RrhhCargo:
      type: object
      required: [id, nombre, departamento, nivelJerarquico, sueldoMinimo, sueldoMaximo]
      properties:
        id:
          type: string
          format: uuid
        nombre: { type: string }
        descripcion: { type: string }
        departamento: { type: string }
        nivelJerarquico: { type: integer }
        sueldoMinimo: { type: integer }
        sueldoMaximo: { type: integer }

    RrhhContratoVigenteResumen:
      type: object
      description: Contrato en estado vigente asociado al empleado (máx. uno)
      required: [id, tipo, jornada, sueldoBase, estado, fechaInicio]
      properties:
        id:
          type: string
          format: uuid
        tipo: { type: string, description: Tipo de contrato (ej. indefinido, plazo fijo) }
        jornada: { type: string }
        sueldoBase:
          type: integer
          description: Sueldo base en CLP del contrato vigente
        estado:
          $ref: '#/components/schemas/RrhhContractStatus'
        fechaInicio: { type: string, format: date }
        fechaFin:
          type: string
          format: date
          nullable: true

    RrhhEmpleado:
      type: object
      required:
        - id
        - rut
        - nombre
        - apellidoPaterno
        - apellidoMaterno
        - email
        - fechaNacimiento
        - fechaIngreso
        - estado
        - fechaCreacion
        - fechaActualizacion
      properties:
        id:
          type: string
          format: uuid
        rut:
          type: string
          description: 'RUT formateado (ej. 12.345.678-9)'
        nombre: { type: string }
        apellidoPaterno: { type: string }
        apellidoMaterno: { type: string }
        email: { type: string, format: email }
        telefono: { type: string, nullable: true }
        fechaNacimiento: { type: string, format: date }
        fechaIngreso: { type: string, format: date }
        estado:
          type: string
          enum: [activo, inactivo, suspendido, licencia]
        direccion:
          $ref: '#/components/schemas/RrhhDireccion'
          nullable: true
        cargo:
          $ref: '#/components/schemas/RrhhCargo'
          nullable: true
        datosBancarios:
          $ref: '#/components/schemas/RrhhDatosBancarios'
          nullable: true
        previsional:
          $ref: '#/components/schemas/RrhhPrevisional'
          nullable: true
        contratoVigente:
          $ref: '#/components/schemas/RrhhContratoVigenteResumen'
          nullable: true
          description: Datos del contrato activo (vigente); null si no tiene
        montoCitaBruta:
          type: integer
          nullable: true
          description: Monto por consulta bruta (CLP enteros)
        montoCitaTotal:
          type: integer
          nullable: true
          description: Monto por consulta total (CLP enteros)
        fechaCreacion: { type: string, format: date-time }
        fechaActualizacion: { type: string, format: date-time }

    RrhhCrearEmpleado:
      type: object
      required: [rut, nombre, apellidoPaterno, apellidoMaterno, email, fechaNacimiento]
      properties:
        rut: { type: string }
        nombre: { type: string }
        apellidoPaterno: { type: string }
        apellidoMaterno: { type: string }
        email: { type: string, format: email }
        telefono: { type: string }
        fechaNacimiento: { type: string, format: date }
        direccion:
          $ref: '#/components/schemas/RrhhDireccion'
        cargoId:
          type: string
          format: uuid
        montoCitaBruta:
          type: integer
          minimum: 0
          nullable: true
          description: Monto por consulta bruta (CLP enteros)
        montoCitaTotal:
          type: integer
          minimum: 0
          nullable: true
          description: Monto por consulta total (CLP enteros)
        datosBancarios:
          $ref: '#/components/schemas/RrhhDatosBancarios'
        previsional:
          $ref: '#/components/schemas/RrhhPrevisional'

    RrhhActualizarEmpleado:
      type: object
      properties:
        email: { type: string, format: email }
        telefono: { type: string }
        estado:
          type: string
          enum: [activo, inactivo, suspendido, licencia]
        cargoId:
          type: string
          format: uuid
          nullable: true
        montoCitaBruta:
          type: integer
          minimum: 0
          nullable: true
          description: Monto por consulta bruta (CLP enteros)
        montoCitaTotal:
          type: integer
          minimum: 0
          nullable: true
          description: Monto por consulta total (CLP enteros)
        direccion:
          $ref: '#/components/schemas/RrhhDireccion'
        datosBancarios:
          $ref: '#/components/schemas/RrhhDatosBancarios'
        previsional:
          $ref: '#/components/schemas/RrhhPrevisional'

    RrhhScheduleExceptionType:
      type: string
      enum: [override, off]

    RrhhScheduleTemplate:
      type: object
      required:
        - id
        - employeeId
        - dayOfWeek
        - startTime
        - endTime
        - isActive
        - effectiveFrom
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: lunes=0 ... domingo=6
        startTime:
          type: string
          pattern: '^([01]\\d|2[0-3]):[0-5]\\d$'
          example: '09:00'
        endTime:
          type: string
          pattern: '^([01]\\d|2[0-3]):[0-5]\\d$'
          example: '18:00'
        isActive: { type: boolean }
        effectiveFrom: { type: string, format: date }
        effectiveTo:
          type: string
          format: date
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RrhhCreateScheduleTemplate:
      type: object
      required: [dayOfWeek, startTime, endTime, effectiveFrom]
      properties:
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: lunes=0 ... domingo=6
        startTime:
          type: string
          pattern: '^([01]\\d|2[0-3]):[0-5]\\d$'
        endTime:
          type: string
          pattern: '^([01]\\d|2[0-3]):[0-5]\\d$'
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
          nullable: true
        isActive:
          type: boolean
          default: true

    RrhhUpdateScheduleTemplate:
      type: object
      properties:
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
        startTime:
          type: string
          pattern: '^([01]\\d|2[0-3]):[0-5]\\d$'
        endTime:
          type: string
          pattern: '^([01]\\d|2[0-3]):[0-5]\\d$'
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
          nullable: true
        isActive:
          type: boolean

    RrhhScheduleException:
      type: object
      required:
        - id
        - employeeId
        - date
        - type
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        date: { type: string, format: date }
        type:
          $ref: '#/components/schemas/RrhhScheduleExceptionType'
        startTime:
          type: string
          pattern: '^([01]\\d|2[0-3]):[0-5]\\d$'
          nullable: true
        endTime:
          type: string
          pattern: '^([01]\\d|2[0-3]):[0-5]\\d$'
          nullable: true
        note:
          type: string
          nullable: true
          maxLength: 500
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RrhhCreateScheduleException:
      type: object
      required: [date, type]
      properties:
        date: { type: string, format: date }
        type:
          $ref: '#/components/schemas/RrhhScheduleExceptionType'
        startTime:
          type: string
          pattern: '^([01]\\d|2[0-3]):[0-5]\\d$'
        endTime:
          type: string
          pattern: '^([01]\\d|2[0-3]):[0-5]\\d$'
        note:
          type: string
          maxLength: 500

    RrhhUpdateScheduleException:
      type: object
      properties:
        date: { type: string, format: date }
