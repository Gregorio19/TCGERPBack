  /pos/sale:
    post:
      tags: [sales]
      summary: Completar una venta en el punto de venta
      x-required-permission: sales.create
      description: Requiere caja abierta del vendedor. Usa precios de catálogo y calcula IVA como en las órdenes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, payments]
              properties:
                clienteId: { type: string, format: uuid, description: Omítelo para una venta a consumidor final. }
                sucursalId: { type: string, format: uuid, description: Por defecto usa la sucursal del vendedor. }
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [productId, cantidad]
                    properties:
                      productId: { type: integer, minimum: 1 }
                      cantidad: { type: integer, minimum: 1 }
                payments:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/PaymentInput'
      responses:
        '201':
          description: Venta completada y stock descontado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ordenId: { type: string, format: uuid }
                  numero: { type: string }
                  total: { type: integer }
                  estado: { type: string, const: completada }
                  cliente:
                    $ref: '#/components/schemas/OrderCustomer'
                  vendedorId: { type: string, format: uuid }
                  vendedor:
                    $ref: '#/components/schemas/Seller'
                  payments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
                  amountTendered: { type: integer, description: Efectivo entregado en CLP. }
                  change: { type: integer, description: Vuelto en CLP. }
        '400':
          description: Los pagos no cuadran, el total está fuera de rango o se usó crédito en tienda sin cliente
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Caja sin abrir, stock de sucursal insuficiente o crédito en tienda insuficiente
        '422':
          $ref: '#/components/responses/Error422'

