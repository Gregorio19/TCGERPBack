    # Productos
    Product:
      type: object
      required:
        - id
        - nombre
        - precio
        - stock
        - categoria
        - activo
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
          maxLength: 200
        descripcion:
          type: string
          nullable: true
        sku:
          type: string
          nullable: true
        juego:
          $ref: '#/components/schemas/Game'
        set:
          type: string
          nullable: true
        nroColeccionista:
          type: string
          nullable: true
        rareza:
          $ref: '#/components/schemas/Rarity'
        idioma:
          $ref: '#/components/schemas/Language'
        condicion:
          $ref: '#/components/schemas/Condition'
        tipo:
          $ref: '#/components/schemas/ProductType'
        precio:
          type: integer
          format: int64
          description: Precio en CLP en pesos enteros
        precioCompra:
          type: integer
          format: int64
          nullable: true
        iva:
          type: integer
          default: 19
          description: Porcentaje de IVA
        stockMinimo: { type: integer, minimum: 0, maximum: 2147483647, default: 0 }
        stock:
          type: integer
          minimum: 0
        categoria:
          type: string
        imagen:
          type: string
          format: uri-reference
          description: Primera imagen de la galería.
          nullable: true
        imagenes:
          type: array
          description: Galería ordenada. Las imágenes nuevas tienen rutas relativas /media/products/{id}/{uuid}.webp.
          items:
            type: string
            format: uri-reference
        stock_sucursales:
          type: object
          additionalProperties:
            type: integer
        activo:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateProductRequest:
      type: object
      description: Las cartas individuales requieren número de coleccionista, rareza, idioma y condición.
      required:
        - nombre
        - precio
        - categoria
      properties:
        nombre:
          type: string
          maxLength: 200
        descripcion:
          type: string
          maxLength: 1000
          nullable: true
        sku:
          type: string
          maxLength: 50
          pattern: '^[A-Z0-9-]*$'
          description: Se genera cuando se omite o se envía vacío.
        juego:
          $ref: '#/components/schemas/Game'
        set:
          type: string
          nullable: true
        nro_coleccionista:
          type: string
          nullable: true
        rareza:
          $ref: '#/components/schemas/Rarity'
        idioma:
          $ref: '#/components/schemas/Language'
        condicion:
          $ref: '#/components/schemas/Condition'
        tipo:
          allOf:
            - $ref: '#/components/schemas/ProductType'
          default: sellado
        precio:
          type: integer
          format: int64
          minimum: 1
          description: Precio en CLP en pesos enteros
        precio_compra:
          type: integer
          format: int64
          nullable: true
        iva:
          type: integer
          minimum: 0
          maximum: 100
          default: 19
          description: Porcentaje de IVA
        stockMinimo: { type: integer, minimum: 0, maximum: 2147483647, default: 0 }
        stock:
          type: integer
          minimum: 0
          default: 0
        branchId:
          type: string
          format: uuid
          description: Sucursal activa para el stock inicial. Por compatibilidad se usa la sucursal del usuario si se omite.
        initialCost:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Si hay stock inicial, reemplaza el precio de compra.
        categoria:
          type: string
        activo:
          type: boolean
          default: true

    UpdateProductRequest:
      type: object
      description: Actualización parcial. El tipo efectivo determina los campos de carta. El stock se cambia mediante ajustes.
      properties:
        nombre:
          type: string
          maxLength: 200
        descripcion:
          type: string
          maxLength: 1000
          nullable: true
        sku:
          type: string
          maxLength: 50
          pattern: '^[A-Z0-9-]*$'
          description: Un SKU vacío conserva el valor actual.
        juego:
          $ref: '#/components/schemas/Game'
        set:
          type: string
          nullable: true
        nro_coleccionista:
          type: string
          nullable: true
        rareza:
          $ref: '#/components/schemas/Rarity'
        idioma:
          $ref: '#/components/schemas/Language'
        condicion:
          $ref: '#/components/schemas/Condition'
        tipo:
          $ref: '#/components/schemas/ProductType'
        precio:
          type: integer
          format: int64
          minimum: 1
          description: Precio en CLP en pesos enteros
        precio_compra:
          type: integer
          format: int64
          nullable: true
        iva:
          type: integer
          minimum: 0
          maximum: 100
          description: Porcentaje de IVA
        stockMinimo: { type: integer, minimum: 0, maximum: 2147483647 }
        categoria:
          type: string

