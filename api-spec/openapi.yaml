          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Caja abierta del usuario autenticado, si existe
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CashSession'
                  - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Error422'

  /cash-sessions/{id}/close:
    post:
      tags: [sales]
      summary: Cerrar y cuadrar caja
      x-required-permission: sales.create
      description: |
        Solo puede cerrar la caja el usuario que la abrió o un supervisor con el permiso `admin.view`.
        El saldo esperado suma el fondo inicial y las ventas en efectivo y resta las devoluciones
        y compras al cliente pagadas en efectivo. La diferencia es el monto contado menos el esperado.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [countedAmount]
              properties:
                countedAmount: { type: integer, minimum: 0, maximum: 2147483647 }
                notes: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Caja cerrada con saldo esperado y diferencia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Caja ya cerrada o monto esperado fuera de rango
        '422':
          $ref: '#/components/responses/Error422'

