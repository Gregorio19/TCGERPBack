      responses:
        '200':
          description: Indicadores de mindicador.cl
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Indicadores' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: Proveedor no disponible y sin datos en caché
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /health:
    get:
      summary: Comprobar el estado de la base de datos
      servers:
        - url: https://api.tcg-erp.com
        - url: http://localhost:3001
      security: []
      responses:
        '200':
          description: Base de datos disponible
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status:
                    const: ok
                  db:
                    const: ok
        '503':
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status:
                    const: degraded
                  db:
                    const: error

  /auth/login:
    post:
      tags: [auth]
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  minLength: 1
                password:
                  type: string
                  minLength: 1
                  format: password
      responses:
        '200':
          description: Sesión creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/TooManyLoginAttempts'

  /auth/refresh:
    post:
      tags: [auth]
