paths:
  /orders/{id}/returns:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [orders]
      summary: Listar devoluciones de la orden
      x-required-permission: sales.view
      responses:
        '200':
          description: Devoluciones de la orden
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderReturn' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Error422' }
    post:
      tags: [orders]
      summary: Registrar devolución y reembolso
      description: |
        Disponible para órdenes completadas o parcialmente devueltas. Reintegra el inventario
        y reembolsa el monto de los artículos con descuentos prorrateados e IVA, excluido el envío.
        El efectivo requiere una caja abierta del usuario en la sucursal de la orden, con saldo suficiente.
        Repetir una clave para la misma orden devuelve la devolución existente.
      x-required-permission: sales.edit
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnRequest' }
      responses:
        '200':
          description: Devolución existente para la misma orden y clave
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderReturn' }
        '201':
          description: Devolución registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderReturn' }
        '400':
          description: Falta Idempotency-Key, su longitud está fuera de rango o se solicitó un reembolso en crédito en tienda sin cliente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Clave usada en otra orden, estado de orden incompatible, caja sin abrir, efectivo insuficiente o saldo de crédito fuera de rango
        '422': { $ref: '#/components/responses/Error422' }

