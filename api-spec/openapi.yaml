        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Error422'

  /cash-sessions:
    get:
      tags: [sales]
      summary: Listar sesiones de caja
      x-required-permission: sales.view
      parameters:
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          description: Inicio inclusivo del rango de aperturas. Una fecha sin hora comienza a las 00:00 UTC.
          schema:
            oneOf:
              - { type: string, format: date }
              - { type: string, format: date-time }
        - name: to
          in: query
          description: Fin inclusivo del rango de aperturas. Una fecha sin hora incluye todo el día UTC.
          schema:
            oneOf:
              - { type: string, format: date }
              - { type: string, format: date-time }
      responses:
        '200':
          description: Sesiones ordenadas por apertura descendente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CashSession'
        '401':
